name: Validate marketplace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace and plugins
        run: ./scripts/validate-marketplace.sh

  test:
    # The skill claims to run on Linux, macOS, and Windows; prove it every push.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/thesis-summarizer/skills/thesis-summarizer/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install plugin dependencies
        run: python -m pip install --upgrade pip pypdfium2 pillow
      - name: Run pdfx test suite
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
      - name: Check the launcher needs no PYTHONPATH
        run: python run_pdfx.py --version
